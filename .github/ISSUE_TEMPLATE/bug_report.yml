name: Bug report
description: Something doesn't work as documented or expected.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems don't belong here**: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the full error message or traceback.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. Open `...`
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA or version
      description: Output of `git rev-parse --short HEAD`, or the release tag.
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.11.9
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant log output. It is formatted as code automatically.
      render: shell
